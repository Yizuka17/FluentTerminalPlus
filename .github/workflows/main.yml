name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build client
        working-directory: ./FluentTerminal.Client
        run: |
          yarn
          yarn build

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: msbuild FluentTerminal.sln -t:build -p:Configuration=Debug -p:Platform=x64 -m -restore

      - name: Upload x64 Debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FluentTerminalPlus-x64-Debug
          if-no-files-found: warn
          retention-days: 14
          path: |
            FluentTerminal.Package/AppPackages/**
            FluentTerminal.Package/bin/x64/Debug/**
            FluentTerminal.App/bin/x64/Debug/**
            FluentTerminal.SystemTray/bin/x64/Debug/**
