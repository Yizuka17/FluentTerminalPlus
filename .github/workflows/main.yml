name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build client
        id: client
        shell: pwsh
        working-directory: ./FluentTerminal.Client
        run: |
          npm ci 2>&1 | Tee-Object -FilePath ..\client-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build 2>&1 | Tee-Object -FilePath ..\client-build.log -Append
          exit $LASTEXITCODE

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        id: msbuild
        shell: pwsh
        run: |
          $uapSdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Platforms\UAP'
          $sdkVersion = Get-ChildItem -Path $uapSdkRoot -Directory -ErrorAction Stop |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty Name

          if ([string]::IsNullOrWhiteSpace($sdkVersion)) {
            throw "No installed UAP Windows SDK was found under $uapSdkRoot"
          }

          Write-Host "Building against Windows SDK $sdkVersion"

          $appProject = 'FluentTerminal.App\FluentTerminal.App.csproj'
          $projectText = Get-Content $appProject -Raw
          $oldDesktopSdk = 'WindowsDesktop, Version=10.0.19041.0'
          $newDesktopSdk = "WindowsDesktop, Version=$sdkVersion"
          if (-not $projectText.Contains($oldDesktopSdk)) {
            throw "Expected WindowsDesktop 19041 SDKReference was not found in $appProject"
          }
          $projectText = $projectText.Replace($oldDesktopSdk, $newDesktopSdk)
          [System.IO.File]::WriteAllText((Resolve-Path $appProject), $projectText, [System.Text.UTF8Encoding]::new($true))

          $certSubject = 'CN=Yizuka17.FluentTerminalPlus'
          $certificate = New-SelfSignedCertificate `
            -Type Custom `
            -Subject $certSubject `
            -FriendlyName 'FluentTerminalPlus CI Development' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -KeyUsage DigitalSignature `
            -KeyExportPolicy Exportable `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3') `
            -NotAfter (Get-Date).AddYears(10)

          $pfxPasswordText = [Guid]::NewGuid().ToString('N')
          $pfxPassword = ConvertTo-SecureString $pfxPasswordText -AsPlainText -Force
          $pfxPath = Join-Path $env:RUNNER_TEMP 'FluentTerminalPlus.Dev.pfx'
          $cerPath = Join-Path (Resolve-Path 'FluentTerminal.Package') 'FluentTerminalPlus.Dev.cer'
          Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $pfxPassword | Out-Null
          Export-Certificate -Cert $certificate -FilePath $cerPath | Out-Null

          $packageProject = 'FluentTerminal.Package\FluentTerminal.Package.wapproj'
          $packageText = Get-Content $packageProject -Raw
          $packageText = $packageText -replace '(?m)^\s*<PackageCertificateKeyFile>.*?</PackageCertificateKeyFile>\s*\r?\n', ''
          $packageText = $packageText -replace '(?m)^\s*<Content Include="FluentTerminal\.App_StoreKey\.pfx" />\s*\r?\n', ''
          $packageText = $packageText -replace '(?m)^\s*<None Include="Package\.StoreAssociation\.xml" />\s*\r?\n', ''
          [System.IO.File]::WriteAllText((Resolve-Path $packageProject), $packageText, [System.Text.UTF8Encoding]::new($true))

          msbuild FluentTerminal.sln `
            -t:build `
            -p:Configuration=Debug `
            -p:Platform=x64 `
            "-p:TargetPlatformVersion=$sdkVersion" `
            "-p:PackageCertificateKeyFile=$pfxPath" `
            "-p:PackageCertificatePassword=$pfxPasswordText" `
            -p:AppxPackageSigningEnabled=true `
            -m:1 `
            -restore 2>&1 | Tee-Object -FilePath msbuild.log
          exit $LASTEXITCODE

      - name: Upload x64 Debug artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FluentTerminalPlus-x64-Debug
          if-no-files-found: warn
          retention-days: 14
          path: |
            client-build.log
            msbuild.log
            FluentTerminal.Package/FluentTerminalPlus.Dev.cer
            FluentTerminal.Package/AppPackages/**
            FluentTerminal.Package/bin/x64/Debug/**
            FluentTerminal.App/bin/x64/Debug/**
            FluentTerminal.SystemTray/bin/x64/Debug/**

      - name: Report CI result to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          CLIENT_OUTCOME: ${{ steps.client.outcome }}
          MSBUILD_OUTCOME: ${{ steps.msbuild.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const marker = '<!-- fluentterminalplus-ci -->';
            const client = process.env.CLIENT_OUTCOME || 'not-run';
            const msbuild = process.env.MSBUILD_OUTCOME || 'not-run';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let logSection = '';
            const failedLog = msbuild === 'failure'
              ? 'msbuild.log'
              : (client === 'failure' ? 'client-build.log' : null);

            if (failedLog && fs.existsSync(failedLog)) {
              let text = fs.readFileSync(failedLog, 'utf8')
                .replace(/\x1b\[[0-9;]*m/g, '')
                .replace(/\r/g, '');
              const lines = text.split('\n');
              text = lines.slice(-90).join('\n');
              if (text.length > 9000) {
                text = text.slice(-9000);
              }
              logSection = `\n\n<details><summary>Failure log tail (${failedLog})</summary>\n\n\`\`\`text\n${text}\n\`\`\`\n</details>`;
            }

            const icon = client === 'success' && msbuild === 'success' ? '✅' : '❌';
            const body = `${marker}\n### ${icon} FluentTerminalPlus CI\n- Client build: **${client}**\n- x64 Debug solution build: **${msbuild}**\n- Commit: \`${context.sha.slice(0, 12)}\`\n- [Open workflow run](${runUrl})${logSection}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });

            const existing = comments.find(comment =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }