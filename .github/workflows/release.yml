name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release v')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner info
        shell: pwsh
        run: |
          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "User: $env:USERNAME"
          Write-Host "Runner temp: $env:RUNNER_TEMP"
          Write-Host "PowerShell: $($PSVersionTable.PSVersion)"

      - name: Build client
        shell: pwsh
        working-directory: ./FluentTerminal.Client
        run: |
          npm ci
          npm run build

      - name: Setup MSBuild.exe
        uses: microsoft/setup-msbuild@v2

      - name: Build signed x64 Release package
        shell: pwsh
        env:
          FTPLUS_SIGNING_PFX_BASE64: ${{ secrets.FTPLUS_SIGNING_PFX_BASE64 }}
          FTPLUS_SIGNING_PFX_PASSWORD: ${{ secrets.FTPLUS_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          # Resolve Windows Kits from the machine configuration first. Self-hosted runners
          # are allowed to keep Visual Studio / Windows Kits on non-system drives.
          $candidateRoots = @()
          foreach ($regPath in @(
            'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows Kits\Installed Roots'
          )) {
            try {
              $kitsRoot10 = (Get-ItemProperty -Path $regPath -Name KitsRoot10 -ErrorAction Stop).KitsRoot10
              if (-not [string]::IsNullOrWhiteSpace($kitsRoot10)) {
                $candidateRoots += Join-Path $kitsRoot10 'Platforms\UAP'
              }
            } catch {
              # Try the other registry view/fallback.
            }
          }
          $candidateRoots += Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Platforms\UAP'
          $uapSdkRoot = $candidateRoots | Select-Object -Unique | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $uapSdkRoot) {
            throw "UAP SDK root not found. Checked: $($candidateRoots -join '; ')"
          }

          $sdkVersion = Get-ChildItem -Path $uapSdkRoot -Directory -ErrorAction Stop |
            Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1 -ExpandProperty Name
          if ([string]::IsNullOrWhiteSpace($sdkVersion)) {
            throw "No installed UAP Windows SDK was found under $uapSdkRoot"
          }
          Write-Host "Building against Windows SDK $sdkVersion from $uapSdkRoot"

          $appProject = 'FluentTerminal.App\FluentTerminal.App.csproj'
          $projectText = Get-Content $appProject -Raw
          $oldDesktopSdk = 'WindowsDesktop, Version=10.0.19041.0'
          $newDesktopSdk = "WindowsDesktop, Version=$sdkVersion"
          if (-not $projectText.Contains($oldDesktopSdk)) {
            throw "Expected WindowsDesktop 19041 SDKReference was not found in $appProject"
          }
          $projectText = $projectText.Replace($oldDesktopSdk, $newDesktopSdk)
          [System.IO.File]::WriteAllText((Resolve-Path $appProject), $projectText, [System.Text.UTF8Encoding]::new($true))

          $manifestText = Get-Content 'FluentTerminal.Package\Package.appxmanifest' -Raw
          if ($manifestText -notmatch '<Identity[^>]+Version="(?<version>\d+\.\d+\.\d+\.\d+)"') {
            throw 'Could not read package version from Package.appxmanifest.'
          }
          $packageVersion = $Matches.version
          $parts = $packageVersion.Split('.')
          $releaseVersion = "$($parts[0]).$($parts[1]).$($parts[2])"
          $releaseTag = "v$releaseVersion"

          $expectedSubject = 'CN=Yizuka17.FluentTerminalPlus'
          $codeSigningOid = '1.3.6.1.5.5.7.3.3'
          $certificate = $null
          $pfxPath = Join-Path $env:RUNNER_TEMP 'FluentTerminalPlus.Release.pfx'
          $pfxPasswordText = $null

          if (-not [string]::IsNullOrWhiteSpace($env:FTPLUS_SIGNING_PFX_BASE64) -and
              -not [string]::IsNullOrWhiteSpace($env:FTPLUS_SIGNING_PFX_PASSWORD)) {
            Write-Host 'Using stable release PFX from GitHub Actions secrets.'
            try {
              [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:FTPLUS_SIGNING_PFX_BASE64))
            }
            catch {
              throw "FTPLUS_SIGNING_PFX_BASE64 is not valid base64: $($_.Exception.Message)"
            }
            $pfxPasswordText = $env:FTPLUS_SIGNING_PFX_PASSWORD
            $pfxFlags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
            $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new(
              $pfxPath,
              $pfxPasswordText,
              $pfxFlags)
          }
          else {
            Write-Host 'Stable PFX secrets are not configured; using the self-hosted runner certificate store.'
            $certificate = Get-ChildItem Cert:\CurrentUser\My |
              Where-Object {
                $_.Subject -eq $expectedSubject -and
                $_.HasPrivateKey -and
                $_.NotAfter -gt (Get-Date).AddDays(30)
              } |
              Sort-Object NotAfter -Descending |
              Select-Object -First 1

            if ($null -eq $certificate) {
              Write-Host 'No reusable FluentTerminalPlus signing certificate found; creating one locally for future releases.'
              $certificate = New-SelfSignedCertificate `
                -Type Custom `
                -Subject $expectedSubject `
                -FriendlyName 'FluentTerminalPlus Release Signing' `
                -CertStoreLocation 'Cert:\CurrentUser\My' `
                -KeyAlgorithm RSA `
                -KeyLength 3072 `
                -HashAlgorithm SHA256 `
                -KeyUsage DigitalSignature `
                -KeyExportPolicy Exportable `
                -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3') `
                -NotAfter (Get-Date).AddYears(10)
            }
            else {
              Write-Host "Reusing local signing certificate $($certificate.Thumbprint)"
            }

            $pfxPasswordText = [Guid]::NewGuid().ToString('N')
            $pfxPassword = ConvertTo-SecureString $pfxPasswordText -AsPlainText -Force
            Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $pfxPassword -Force | Out-Null
          }

          if ($certificate.Subject -ne $expectedSubject) {
            throw "Signing certificate subject '$($certificate.Subject)' does not match '$expectedSubject'."
          }
          if (-not $certificate.HasPrivateKey) {
            throw 'The selected signing certificate does not contain a private key.'
          }
          if ($certificate.NotAfter -le (Get-Date).AddDays(30)) {
            throw "The selected signing certificate expires too soon: $($certificate.NotAfter.ToString('u'))"
          }

          $ekuOk = $false
          foreach ($extension in $certificate.Extensions) {
            if ($extension -is [System.Security.Cryptography.X509Certificates.X509EnhancedKeyUsageExtension]) {
              foreach ($oid in $extension.EnhancedKeyUsages) {
                if ($oid.Value -eq $codeSigningOid) { $ekuOk = $true }
              }
            }
          }
          if (-not $ekuOk) {
            throw 'The selected signing certificate is missing the Code Signing EKU.'
          }

          $cerPath = Join-Path (Resolve-Path 'FluentTerminal.Package') 'FluentTerminalPlus.Release.cer'
          Export-Certificate -Cert $certificate -FilePath $cerPath -Force | Out-Null
          Write-Host "Using release certificate thumbprint $($certificate.Thumbprint)"
          Write-Host "Certificate valid through $($certificate.NotAfter.ToString('u'))"

          $packageProject = 'FluentTerminal.Package\FluentTerminal.Package.wapproj'
          $packageText = Get-Content $packageProject -Raw
          $packageText = $packageText -replace '(?m)^\s*<PackageCertificateKeyFile>.*?</PackageCertificateKeyFile>\s*\r?\n', ''
          $packageText = $packageText -replace '(?m)^\s*<Content Include="FluentTerminal\.App_StoreKey\.pfx" />\s*\r?\n', ''
          $packageText = $packageText -replace '(?m)^\s*<None Include="Package\.StoreAssociation\.xml" />\s*\r?\n', ''
          [System.IO.File]::WriteAllText((Resolve-Path $packageProject), $packageText, [System.Text.UTF8Encoding]::new($true))

          # Self-hosted workspaces persist. Remove stale build/package outputs explicitly so a
          # formal release cannot accidentally pick up an older bundle.
          foreach ($path in @(
            'FluentTerminal.Package\AppPackages',
            'FluentTerminal.Package\bin',
            'FluentTerminal.Package\obj',
            'FluentTerminal.App\bin',
            'FluentTerminal.App\obj',
            'FluentTerminal.SystemTray\bin',
            'FluentTerminal.SystemTray\obj'
          )) {
            if (Test-Path $path) { Remove-Item $path -Recurse -Force }
          }

          msbuild FluentTerminal.sln `
            -t:build `
            -p:Configuration=Release `
            -p:Platform=x64 `
            "-p:TargetPlatformVersion=$sdkVersion" `
            "-p:PackageCertificateKeyFile=$pfxPath" `
            "-p:PackageCertificatePassword=$pfxPasswordText" `
            -p:AppxPackageSigningEnabled=true `
            -m:1 `
            -restore 2>&1 | Tee-Object -FilePath msbuild-release.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $bundle = Get-ChildItem 'FluentTerminal.Package\AppPackages' -Filter '*.msixbundle' -File -Recurse |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if ($null -eq $bundle) {
            throw 'Release build succeeded but no Desktop Bridge .msixbundle was found.'
          }

          $packageDir = $bundle.Directory.FullName
          Copy-Item $cerPath (Join-Path $packageDir 'FluentTerminalPlus.Release.cer') -Force

          $releaseRoot = Join-Path $env:RUNNER_TEMP "FluentTerminalPlus-$releaseTag"
          if (Test-Path $releaseRoot) { Remove-Item $releaseRoot -Recurse -Force }
          New-Item -ItemType Directory -Path $releaseRoot | Out-Null
          Copy-Item (Join-Path $packageDir '*') $releaseRoot -Recurse -Force

          $releaseZip = Join-Path $PWD "FluentTerminalPlus-$releaseTag-x64.zip"
          Compress-Archive -Path (Join-Path $releaseRoot '*') -DestinationPath $releaseZip -CompressionLevel Optimal -Force

          "RELEASE_VERSION=$releaseVersion" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$releaseTag" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_ZIP=$releaseZip" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_CER=$cerPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluentTerminalPlus-${{ env.RELEASE_TAG }}-x64-Release
          retention-days: 90
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_CER }}
            msbuild-release.log

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @"
          FluentTerminalPlus $env:RELEASE_TAG

          Maintenance release for FluentTerminalPlus on Windows 10.

          Highlights:
          - Fixes the lingering background-process/tray lifetime issue when the final app window closes.
          - Releases the UWP AppService deferral when no terminal/settings windows remain, then exits the tray when the AppService closes.
          - Corrects FluentTerminalPlus product names, About/project/release links and package metadata left over from upstream.
          - Improves Simplified/Traditional Chinese text for Plus-specific settings and tray actions.
          - Keeps Windows PowerShell 5.1, PowerShell 7 / Microsoft Store PowerShell resolution, per-profile administrator launch and ConPTY behavior from v0.8.0.

          Installation:
          Extract the ZIP, trust the included FluentTerminalPlus.Release.cer certificate, then run Install.ps1 in the package folder.
          "@ | Set-Content release-notes.md -Encoding UTF8

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $env:RELEASE_ZIP $env:RELEASE_CER --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:RELEASE_TAG $env:RELEASE_ZIP $env:RELEASE_CER `
              --target $env:GITHUB_SHA `
              --title "FluentTerminalPlus $env:RELEASE_TAG" `
              --notes-file release-notes.md `
              --repo $env:GITHUB_REPOSITORY
          }
