name: Release Observer

on:
  push:
    branches:
      - release/v0.8.0-observer
    paths:
      - .release-trigger

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect master release state
        uses: actions/github-script@v7
        env:
          TARGET_SHA: 4d1e9cbf8dd649b0d9a1f9387553862c72b92784
          TARGET_TAG: v0.8.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const targetSha = process.env.TARGET_SHA;
            const tag = process.env.TARGET_TAG;

            const runsResponse = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: targetSha,
              per_page: 100
            });

            const runs = runsResponse.data.workflow_runs.map(run => ({
              id: run.id,
              name: run.name,
              event: run.event,
              head_branch: run.head_branch,
              head_sha: run.head_sha,
              status: run.status,
              conclusion: run.conclusion,
              run_number: run.run_number,
              html_url: run.html_url,
              created_at: run.created_at,
              updated_at: run.updated_at
            }));

            let release = null;
            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              release = {
                id: response.data.id,
                tag_name: response.data.tag_name,
                name: response.data.name,
                draft: response.data.draft,
                prerelease: response.data.prerelease,
                html_url: response.data.html_url,
                published_at: response.data.published_at,
                target_commitish: response.data.target_commitish,
                assets: response.data.assets.map(asset => ({
                  id: asset.id,
                  name: asset.name,
                  size: asset.size,
                  state: asset.state,
                  browser_download_url: asset.browser_download_url,
                  digest: asset.digest || null
                }))
              };
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const payload = {
              observed_at: new Date().toISOString(),
              target_sha: targetSha,
              target_tag: tag,
              workflow_runs: runs,
              release
            };

            const content = Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'release-status.json',
                ref: context.ref
              });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'release-status.json',
              message: 'Record v0.8.0 release status',
              content,
              branch: context.ref.replace('refs/heads/', ''),
              ...(sha ? { sha } : {})
            });
